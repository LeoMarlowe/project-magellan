name: Game regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Browser tests render on the CPU here (no GPU), at a few frames a second.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run vendor && git diff --exit-code -- vendor/
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        # Also when the job runs out of time, so the traces show where it stalled.
        if: failure() || cancelled()
        with:
          name: browser-failure-traces
          path: output/playwright/
          retention-days: 7
